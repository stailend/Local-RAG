<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local-RAG</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
    body { max-width: 900px; margin: 0 auto; padding: 32px 20px; background: #101318; color: #eef2f7; }
    h1 { margin-bottom: 4px; } .muted { color: #9ca8b8; }
    form { display: flex; gap: 10px; margin: 28px 0; }
    input { flex: 1; padding: 13px; border: 1px solid #3b4656; border-radius: 8px; background: #171d26; color: inherit; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #3b82f6; color: white; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #answer { white-space: pre-wrap; line-height: 1.55; }
    .card { margin-top: 16px; padding: 18px; border: 1px solid #2b3543; border-radius: 10px; background: #151b24; }
    li { margin: 10px 0; color: #b9c5d4; } code { color: #8fc7ff; }
    #status { font-size: 13px; }
    .filters { display: flex; gap: 10px; margin-top: -14px; }
    .filters input { width: 50%; }
    #upload-form { align-items: center; margin: 20px 0; }
    #upload-form input { min-width: 0; }
    progress { width: 100%; height: 12px; }
    #groups button { margin: 4px 8px 4px 0; }
    #groups p { margin: 6px 0 14px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Local-RAG</h1>
  <div id="status" class="muted">Checking index…</div>
  <form id="upload-form">
    <input id="file" type="file" required aria-label="Document to upload">
    <button id="upload">Upload & index</button>
  </form>
  <div id="upload-status" class="muted" role="status"></div>
  <progress id="upload-progress" hidden></progress>
  <form id="form">
    <input id="question" autocomplete="off" placeholder="Ask about your indexed documents…" required>
    <button id="submit">Ask</button>
  </form>
  <div class="filters">
    <input id="source" list="source-options" placeholder="Optional: file path" aria-label="Filter by file">
    <datalist id="source-options"></datalist>
    <input id="folder" list="folder-options" placeholder="Optional: folder path" aria-label="Filter by folder">
    <datalist id="folder-options"></datalist>
  </div>
  <section class="card"><div id="answer" class="muted">Your answer will appear here.</div></section>
  <section class="card"><strong>Sources</strong><ul id="sources"></ul></section>
  <section class="card">
    <button id="summarize" type="button">Generate / update summaries</button>
    <button id="explore" type="button">Explore document groups</button>
    <div id="summary-status" class="muted" role="status"></div>
    <span id="active-cluster" class="muted"></span>
    <div id="groups" aria-live="polite"></div>
  </section>
  <script>
    const $ = id => document.getElementById(id);
    async function status() {
      try {
        const data = await fetch('/api/status').then(r => r.json());
        $('status').textContent = `${data.points} chunks · ${data.collection} · ${data.provider}`;
      } catch (error) { $('status').textContent = 'Index unavailable'; }
    }
    async function loadSources() {
      const data = await fetch('/api/sources').then(r => r.json());
      for (const [field, values] of [['source-options', data.sources], ['folder-options', data.folders]]) {
        $(field).replaceChildren(...values.map(value => {
          const option = document.createElement('option'); option.value = value; return option;
        }));
      }
    }
    $('form').addEventListener('submit', async event => {
      event.preventDefault();
      $('submit').disabled = true; $('answer').textContent = 'Thinking…'; $('sources').textContent = '';
      try {
        const response = await fetch('/api/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: $('question').value, source: $('source').value, folder: $('folder').value, cluster: $('active-cluster').dataset.id || ''}) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed');
        $('answer').textContent = data.answer;
        for (const source of data.sources) {
          const item = document.createElement('li'); item.textContent = `${source.source.split(/[\\/]/).pop()} · ${source.locator} · chunk ${source.chunk}`; $('sources').append(item);
        }
      } catch (error) { $('answer').textContent = error.message; }
      finally { $('submit').disabled = false; }
    });
    $('upload-form').addEventListener('submit', async event => {
      event.preventDefault();
      const file = $('file').files[0];
      if (!file) return;
      $('upload').disabled = true;
      $('upload-status').textContent = `Uploading ${file.name}…`;
      $('upload-progress').hidden = false;
      $('upload-progress').removeAttribute('value');
      try {
        const response = await fetch(`/api/uploads?filename=${encodeURIComponent(file.name)}`, {
          method: 'POST', headers: {'Content-Type': 'application/octet-stream'}, body: file
        });
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || 'Upload failed');
        for (;;) {
          const state = await fetch(`/api/jobs/${job.id}`).then(r => r.json());
          if (state.stage === 'error') throw new Error(state.error);
          $('upload-status').textContent = `${state.filename}: ${state.stage}${state.total ? ` ${state.done}/${state.total} chunks` : ''}`;
          if (state.total) { $('upload-progress').max = state.total; $('upload-progress').value = state.done; }
          if (state.stage === 'done') { await status(); await loadSources(); break; }
          await new Promise(resolve => setTimeout(resolve, 500));
        }
      } catch (error) { $('upload-status').textContent = error.message; }
      finally { $('upload').disabled = false; $('upload-progress').hidden = true; }
    });
    $('explore').addEventListener('click', async () => {
      $('explore').disabled = true;
      $('groups').textContent = 'Loading summaries and groups…';
      try {
        const response = await fetch('/api/clusters');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load groups');
        $('groups').replaceChildren();
        if (!data.clusters.length) $('groups').textContent = 'No summaries yet. Run local-rag summarize first.';
        for (const group of data.clusters) {
          const card = document.createElement('div'); card.className = 'card';
          const pick = document.createElement('button');
          pick.type = 'button'; pick.textContent = `${group.label} · ${group.files.length} files`;
          pick.addEventListener('click', () => {
            $('active-cluster').dataset.id = group.id;
            $('active-cluster').textContent = `Searching group: ${group.label} (click to clear)`;
            $('source').value = ''; $('folder').value = '';
          });
          card.append(pick);
          for (const file of group.files) {
            const item = document.createElement('p');
            const select = document.createElement('button');
            select.type = 'button'; select.textContent = file.source.split(/[\\/]/).pop();
            select.addEventListener('click', () => {
              $('source').value = file.source;
              $('active-cluster').dataset.id = '';
              $('active-cluster').textContent = '';
            });
            const summary = document.createElement('span');
            summary.textContent = ` ${file.summary}`;
            item.append(select, summary); card.append(item);
          }
          $('groups').append(card);
        }
      } catch (error) { $('groups').textContent = error.message; }
      finally { $('explore').disabled = false; }
    });
    $('summarize').addEventListener('click', async () => {
      $('summarize').disabled = true;
      $('summary-status').textContent = 'Preparing summaries…';
      try {
        const response = await fetch('/api/summarize', {method: 'POST'});
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || 'Could not start summaries');
        for (;;) {
          const state = await fetch(`/api/jobs/${job.id}`).then(r => r.json());
          if (state.stage === 'error') throw new Error(state.error);
          $('summary-status').textContent = `Summaries: ${state.stage}${state.total ? ` ${state.done}/${state.total} files` : ''}`;
          if (state.stage === 'done') break;
          await new Promise(resolve => setTimeout(resolve, 500));
        }
      } catch (error) { $('summary-status').textContent = error.message; }
      finally { $('summarize').disabled = false; }
    });
    $('active-cluster').addEventListener('click', () => {
      $('active-cluster').dataset.id = ''; $('active-cluster').textContent = '';
    });
    for (const field of ['source', 'folder']) $(field).addEventListener('input', () => {
      $('active-cluster').dataset.id = ''; $('active-cluster').textContent = '';
    });
    status(); loadSources();
  </script>
</body>
</html>
