[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag"
version = "0.3.0"
description = "Privacy-first RAG over local files with Ollama or any OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexej Meyerhans" }]
dependencies = [
  "fastembed>=0.7,<1",
  "flashrank>=0.2,<1",
  "httpx>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "qdrant-client>=1.12,<2",
]

[project.scripts]
local-rag = "local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
